<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAG Assistant</title>
  <link rel="stylesheet" href="static/style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
  <main class="shell">
    <header class="head">
      <h1>Cat Facts Assistant</h1>
      <p>Ask questions about your favorite animal companion!</p>
    </header>
    <section id="chat" class="chat" aria-live="polite">
      <p class="meta">Ready.</p>
    </section>
    <p id="notice" class="notice" role="alert"></p>
    <form id="composer" class="composer" action="#" onsubmit="return false"><textarea id="message"
        placeholder="Ask the chatbot here…" required maxlength="5000" aria-label="Question"></textarea><button
        id="send" type="submit">Send</button></form>
  </main>
  <script>
    const chat = document.querySelector('#chat'), form = document.querySelector('#composer'), input = document.querySelector('#message'), send = document.querySelector('#send'), notice = document.querySelector('#notice'); const history = [];
    const streamUrl = __STREAM_URL__;
    function add(text, role) { const el = document.createElement('article'); el.className = 'message ' + role; el.textContent = text; chat.append(el); chat.scrollTop = chat.scrollHeight; return el } function addSources(items) { if (!items.length) return; const el = document.createElement('div'); el.className = 'sources'; el.textContent = 'Retrieved: '; items.forEach(s => { const tag = document.createElement('span'); tag.textContent = `${s.source}, line ${s.line}`; el.append(tag) }); chat.append(el) }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;
      notice.textContent = '';
      add(message, 'user');
      history.push({ role: 'user', content: message });
      input.value = '';
      send.disabled = true;
      const answer = add('', 'assistant');
      try {
        const response = await fetch(streamUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/x-ndjson' },
          body: JSON.stringify({ message, history: history.slice(0, -1) }),
        });
        if (!response.ok || !response.body) throw new Error(`Request failed (${response.status})`);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        for (; ;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            if (!line) continue;
            const streamEvent = JSON.parse(line);
            if (streamEvent.event === 'token') {
              answer.textContent += streamEvent.data.text;
              chat.scrollTop = chat.scrollHeight;
            } else if (streamEvent.event === 'sources') {
              addSources(streamEvent.data.items);
            } else if (streamEvent.event === 'status') {
              notice.textContent = streamEvent.data.message;
            } else if (streamEvent.event === 'error') {
              answer.textContent = streamEvent.data.message;
              notice.textContent = streamEvent.data.message;
            }
          }
        }
        if (buffer) {
          const streamEvent = JSON.parse(buffer);
          if (streamEvent.event === 'error') {
            answer.textContent = streamEvent.data.message;
            notice.textContent = streamEvent.data.message;
          }
        }
        if (answer.textContent) history.push({ role: 'assistant', content: answer.textContent });
        notice.textContent = '';
      } catch (error) {
        answer.textContent = 'The chat request failed. Please try again.';
        notice.textContent = answer.textContent;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>

</html>
